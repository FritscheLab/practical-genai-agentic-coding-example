[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgacg"
version = "0.1.0"
description = "Practical GenAI Agentic Coding Example: synthetic BMI pipeline"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Lars G. Fritsche"}]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
]

[project.urls]
Homepage = "https://fritschelab.org/practical-genai-agentic-coding-guide/"
Repository = "https://github.com/FritscheLab/practical-genai-agentic-coding-example"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
