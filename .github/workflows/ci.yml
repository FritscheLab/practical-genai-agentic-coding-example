name: Exercise checks

on:
  push:
  pull_request:

jobs:
  python-plotting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-plotting.txt
      - name: Install plotting dependencies
        run: python -m pip install -r requirements-plotting.txt
      - name: Check plotting behavior
        run: python -m unittest discover -s plotting/tests
      - name: Run documented baseline
        run: python plotting/plot_summary.py --output runs/baseline/summary.png

  r-plotting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
      - name: Check R plotting behavior
        run: Rscript plotting/tests/run_tests.R
      - name: Verify the optional R refactoring example
        run: Rscript examples/r_refactor/verify.R
      - name: Run the documented R baseline
        run: Rscript plotting/plot_summary.R --output runs/baseline/summary.png
